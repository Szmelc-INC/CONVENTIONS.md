# Sources for the Projects index tab (META/tools/site.sh).
# One directive per line. Comments start with '#'.
#
#   owner  <github-login>     a user or org; every public, non-archived, non-fork repo is indexed
#   ignore <name|owner/name>  hide a repo from the public index (exact match)
#   third-party <owner/name>  one public non-Szmelc™ repo this repo uses; indexed with origin `third-party`
#
# The compat registry (META/compat/registry.toml) is also listed on the Projects
# tab as third-party; do not repeat its entries here.
#
# The index is built from the GitHub API in CI, so it reproduces anywhere `gh`
# is authenticated. No local filesystem scan is involved.
#
# Every `owner` listed is a Szmelc™ account: its repos are Szmelc™ (origin
# `original`), never third-party. Add any public org of these accounts here too.

owner Szmelc-INC
owner sernik77
owner CYBERSZP0NT
owner Entropy-Linux
owner SZYCHTA
owner Szmelc-OS

# Org/profile meta repos and placeholders, not projects.
ignore .github
ignore sernik77/sernik77
ignore Entropy-Linux/root
ignore Entropy-Linux/.github
ignore Szmelc-INC/.github
ignore CYBERSZP0NT/.github

# GitHub Actions used by .github/workflows.
third-party actions/checkout
third-party actions/upload-pages-artifact
third-party actions/deploy-pages
