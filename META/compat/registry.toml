# Compatibility registry: third-party formats, specs, platforms, languages and tools these conventions are compatible with.
# Single source of COMPATIBILITY.md, index.json ("compatible", "compatible_disclaimer") and the site. Edit here, then run META/tools/build.sh.
# TOML 1.0 subset read by META/tools/compat.awk (CONVENTIONS/FORMATS/TOML.md):
#   key = "string"  (no double quote or backslash inside), key = ["a", "b"], key = YYYY-MM-DD (TOML local date).
#   One [[compat]] record per entry, optionally followed by its [compat.links] table. Comments on their own line only.
# Record keys:
#   id           required; lowercase kebab, unique
#   name         required; display name
#   kind         required; format | spec | platform | tool | language | stack
#   description  required; one factual line
#   version      required; exact upstream version these conventions target, or "unversioned" when upstream has none
#   added        required; date the entry was added
#   updated      required; date the entry last changed (bump on every edit)
#   icon         optional; path under META/compat/icons/ (monochrome, fill currentColor); omit when none exists
#   spec         optional; rule files that cover it (CONVENTIONS/...)
# [compat.links] keys, official https URLs only, each returning HTTP 200 when added: homepage, repo, docs, community.

disclaimer = "Names and logos are trademarks of their respective owners. Szmelc is not affiliated with, sponsored or endorsed by them. A listing means only that these conventions are compatible with the named format, specification, platform, language or tool."

