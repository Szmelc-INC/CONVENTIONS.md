name: check
on: [push, pull_request, workflow_dispatch]
permissions: {}
concurrency:
  group: check-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: structure, generated files, references
        run: bash META/tools/check.sh
      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/*.yml
      - name: index schema
        run: npx --yes --package=ajv-cli@5.0.0 --package=ajv-formats@3.0.1 ajv validate --spec=draft2020 -c ajv-formats -s META/schema/index.schema.json -d index.json
      - name: shellcheck
        run: shellcheck install.sh META/tools/*.sh META/tools/hooks/*
      - name: review-gate decision tests
        run: bash META/tools/review-gate.sh --self-test
      - name: installer smoke test (throwaway HOME)
        run: bash META/tools/test-install.sh
      - name: release dry run
        run: bash META/tools/release.sh --dry-run
      - name: dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: moderate
      - name: v2.0.2 Szmelc profile compatibility
        run: bash META/tools/test-profile-compat.sh
      - name: prose lint (STE100++)
        run: bash META/tools/prose-lint.sh --strict --summary
      - name: branch scope
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: bash META/tools/lane-check.sh "$HEAD_REF" "origin/$BASE_REF"
