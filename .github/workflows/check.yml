name: check
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: check-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: structure, generated files, references
        run: bash META/tools/check.sh
      - name: shellcheck
        run: shellcheck install.sh META/tools/*.sh META/tools/hooks/*
      - name: review-gate decision tests
        run: bash META/tools/review-gate.sh --self-test
      - name: installer smoke test (throwaway HOME)
        run: bash META/tools/test-install.sh
      - name: v2.0.2 Szmelc profile compatibility
        run: bash META/tools/test-profile-compat.sh
      - name: branch scope
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: bash META/tools/lane-check.sh "$HEAD_REF" "origin/$BASE_REF"
