name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)release, e.g. v2.0.0; empty only with dry run'
        required: false
        type: string
      dry_run:
        description: 'Build and checksum, publish nothing'
        required: false
        type: boolean
        default: true

permissions: {}

concurrency:
  group: release-${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
      DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          fetch-depth: 0
      - name: Use current release tooling for manual retries
        if: github.event_name == 'workflow_dispatch'
        run: |
          git fetch --no-tags origin main
          git show FETCH_HEAD:META/tools/release.sh > "$RUNNER_TEMP/release.sh"
          install -m 755 "$RUNNER_TEMP/release.sh" META/tools/release.sh
      - name: release
        run: |
          args=()
          [[ -n $DRY_RUN ]] && args+=(--dry-run)
          [[ -n $TAG ]] && args+=("$TAG")
          bash META/tools/release.sh "${args[@]}"
      - name: attest release assets
        if: github.event_name == 'push' || inputs.dry_run == false
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: dist/${{ env.TAG }}/*
