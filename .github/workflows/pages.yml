name: pages

on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - llms.txt
      - index.json
      - META/tools/site.sh
      - 'META/compat/**'
      - 'META/schema/**'
      - 'SPEC/**'
      - 'examples/minimal/**'
      - PROFILES/szmelc/sources.conf
      - .github/workflows/pages.yml
  schedule:
    - cron: '0 3 * * *' # nightly 03:00 UTC: refresh the Projects index as repos change
  workflow_dispatch:
  repository_dispatch:
    types: [conventions-rebuild]

permissions: {}

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      PUBLISH: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Build site
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          META/tools/site.sh

      - name: Upload site
        if: env.PUBLISH == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: public

  # Scheduled workflows are disabled after 60 days without repo activity.
  # Keepalive: after ~45 quiet days, re-enable this workflow through the API.
  # No commit, so main's ruleset needs no bypass actor (README "Automation").
  keepalive:
    if: github.event_name == 'schedule' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Keepalive
        run: |
          if (( $(date +%s) - $(git log -1 --format=%ct) > 45 * 86400 )); then
            gh api -X PUT "repos/$REPO/actions/workflows/pages.yml/enable"
            echo "keepalive: re-enabled pages.yml" >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

  nightly-failure-notice:
    needs: [build, deploy]
    if: always() && github.event_name == 'schedule' && (needs.build.result == 'failure' || needs.deploy.result == 'failure')
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Add a run summary with a direct link
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo '## Nightly Pages build failed'
            echo
            echo "The scheduled site build or deployment failed. Review the run: [$GITHUB_RUN_ID]($RUN_URL)."
          } >> "$GITHUB_STEP_SUMMARY"
