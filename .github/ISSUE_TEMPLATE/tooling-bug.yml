name: Tooling bug
description: build.sh, check.sh, install.sh, the site or CI misbehaves.
title: "Fix "
labels: [bug, area/meta]
body:
  - type: dropdown
    id: tool
    attributes:
      label: Tool
      options:
        - META/tools/build.sh
        - META/tools/check.sh
        - install.sh
        - Site (META/tools/site.sh, Pages)
        - CI or release workflow
        - Other
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command
      placeholder: META/tools/check.sh
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: Full error output; strip personal paths and names.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS, shell, `bash --version`, commit (`git rev-parse --short HEAD`).
